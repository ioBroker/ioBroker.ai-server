# Cooldown delays the updates of npm dependencies by 7 days, security updates are processed immediately.
# Cooldown is not supported for the github-actions ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "17 3 6 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - GermanBluefox
    versioning-strategy: increase
    cooldown:
      default-days: 7
    ignore:
      # @types/node follows the minimal supported Node.js version
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "17 3 6 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - GermanBluefox
